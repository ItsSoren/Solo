<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="google-site-verification" content="h56hWxMgQnXtoLFuFWVBrxlmdLWLaZz4">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com; frame-src https://novatasks-23d9d.firebaseapp.com https://accounts.google.com">
  <title>Sōlo — Organise l’essentiel</title>
  <meta name="description" content="Objectifs, notes et espaces partagés dans une interface simple et opale.">
  <meta name="keywords" content="Sōlo, tâches, objectifs, notes, espaces partagés, organisation">
  <meta name="theme-color" content="#f1fbfc">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/solo-mark-opal.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/solo-mark-opal.png">
  <link rel="stylesheet" href="nova.css?v=10.0.0">
  <link rel="stylesheet" href="planner.css?v=10.1.0">
  <link rel="stylesheet" href="assets/bootstrap-icons.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="brand menu-btn" data-section="home" aria-label="Accueil Sōlo">
      <span class="brand-mark"><img src="assets/solo-mark-opal.png" alt=""></span>
      <span class="brand-copy"><strong>Sōlo</strong><small>Organise l’essentiel</small></span>
    </button>

    <nav class="desktop-nav" aria-label="Navigation principale">
      <button type="button" class="nav-btn menu-btn active" data-section="home"><i class="bi bi-house"></i><span>Aujourd’hui</span></button>
      <button type="button" class="nav-btn menu-btn" data-section="calendar"><i class="bi bi-calendar3"></i><span>Calendrier</span></button>
      <button type="button" class="nav-btn menu-btn" data-section="tasks"><i class="bi bi-check2-square"></i><span>Objectifs</span></button>
      <button type="button" class="nav-btn menu-btn" data-section="notes"><i class="bi bi-journal-text"></i><span>Notes</span></button>
      <button type="button" class="nav-btn menu-btn" data-section="shared"><i class="bi bi-people"></i><span>Partagé</span></button>
      <button type="button" class="nav-btn menu-btn" data-section="stats"><i class="bi bi-bar-chart"></i><span>Statistiques</span></button>
    </nav>

    <div class="top-actions">
      <button type="button" id="globalSearchBtn" class="search-trigger" aria-label="Rechercher dans Sōlo"><i class="bi bi-search"></i><span>Rechercher</span><kbd>Ctrl K</kbd></button>
      <button type="button" id="quickCreateBtn" class="primary compact"><i class="bi bi-plus-lg"></i><span>Créer</span></button>
      <button type="button" class="profile-button menu-btn" data-section="profile" aria-label="Profil et réglages"><i class="bi bi-person"></i><span id="accountStatusDot" class="account-status-dot local" aria-hidden="true"></span></button>
    </div>
  </header>

  <main class="app-main">
    <section id="homeSection" class="page active" aria-label="Aujourd’hui"></section>
    <section id="calendarSection" class="page" aria-label="Calendrier"></section>
    <section id="tasksSection" class="page" aria-label="Objectifs"></section>
    <section id="notesSection" class="page" aria-label="Notes"></section>
    <section id="sharedSection" class="page" aria-label="Espaces partagés"></section>
    <section id="statsSection" class="page" aria-label="Statistiques"></section>
    <section id="profileSection" class="page" aria-label="Profil et réglages"></section>
  </main>

  <nav class="mobile-nav" aria-label="Navigation mobile">
    <button type="button" class="menu-btn active" data-section="home"><i class="bi bi-house"></i><small>Aujourd’hui</small></button>
    <button type="button" class="menu-btn" data-section="calendar"><i class="bi bi-calendar3"></i><small>Calendrier</small></button>
    <button type="button" id="mobileCreateBtn" class="mobile-create" aria-label="Créer"><i class="bi bi-plus-lg"></i></button>
    <button type="button" class="menu-btn" data-section="notes"><i class="bi bi-journal-text"></i><small>Notes</small></button>
    <button type="button" class="menu-btn" data-section="shared"><i class="bi bi-people"></i><small>Partagé</small></button>
  </nav>

  <div id="quickMenu" class="quick-menu hidden" role="menu">
    <button type="button" data-quick="task"><span><i class="bi bi-check2-square"></i></span><div><strong>Nouvel objectif</strong><small>Une action et ses étapes</small></div></button>
    <button type="button" data-quick="note"><span><i class="bi bi-journal-plus"></i></span><div><strong>Nouvelle note</strong><small>Texte, listes et cases à cocher</small></div></button>
    <button type="button" data-quick="shared"><span><i class="bi bi-people"></i></span><div><strong>Espace partagé</strong><small>Collaborer avec un proche</small></div></button>
  </div>

  <dialog id="taskDialog" class="modal-sheet"></dialog>
  <dialog id="noteDialog" class="modal-sheet note-sheet"></dialog>
  <dialog id="commandDialog" class="command-sheet"></dialog>
  <dialog id="confirmDialog" class="confirm-sheet"></dialog>
  <dialog id="accountDialog" class="account-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="editor.js?v=10.0.0"></script>
  <script src="planner-core.js?v=10.1.0"></script>
  <script src="nova-app.js?v=10.1.0"></script>
  <script src="planner.js?v=10.1.0"></script>
  <script src="nova-debug.js?v=1.0.1"></script>
  <script src="cloud-loader.js?v=10.0.0"></script>
  <script src="nova-ux.js?v=10.1.0"></script>
</body>
</html>
